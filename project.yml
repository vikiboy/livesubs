name: LiveSubs
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: "1.1.1"
  MLXSwiftLM:          # TranslateGemma on the GPU (MLX)
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.33.0"
  SwiftTransformers:   # its tokenizer
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  LiveSubs:
    type: application
    platform: iOS
    sources:
      - path: LiveSubs
        excludes:
          - Engine/ParakeetRecognizer.swift   # Mac test harness only (lost to Apple's recogniser on long audio)
      - path: Shared
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
      - target: BroadcastExtension
        embed: true
      - target: LiveSubsControls
        embed: true
    entitlements:
      path: LiveSubs/Resources/LiveSubs.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.kernel.increased-memory-limit: true   # speech model + TranslateGemma
    info:
      path: LiveSubs/Resources/Info.plist
      properties:
        CFBundleDisplayName: LiveSubs
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSAppGroupIdentifier: $(APP_GROUP_ID)
        LiveSubsBuildStamp: $(LIVESUBS_STAMP)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:   # portrait; the browser's fullscreen video may rotate (OrientationLock)
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio          # Picture-in-Picture subtitles + keep running behind other apps
          - screen-capture # iOS 27 ScreenCaptureKit capture continues in background
        NSMicrophoneUsageDescription: Microphone mode listens to speech around you (e.g. a TV) to show English subtitles. Audio is processed only on this iPhone.
        NSScreenCaptureUsageDescription: LiveSubs listens to the sound of videos playing on your iPhone to show English subtitles. Audio and video are never saved or sent anywhere.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSSpeechRecognitionUsageDescription: Apple engine mode uses on-device speech recognition to create subtitles.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).livesubs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: LiveSubs

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
      - path: Shared
    dependencies:
      - sdk: ReplayKit.framework
    entitlements:
      path: BroadcastExtension/BroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: LiveSubs
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSAppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).livesubs.BroadcastExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  LiveSubsControls:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveSubsControls
      - path: LiveSubs/App/LiveSubsIntents.swift
      - path: LiveSubs/App/SubtitleActivity.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: LiveSubsControls/Info.plist
      properties:
        CFBundleDisplayName: LiveSubs
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).livesubs.Controls
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
